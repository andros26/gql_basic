
type Query {
  getPeopleInMongo: [People]
}


type People {
  _id: ID!
  name: String!
  dateOfBirth: String!
  address: String!
  email: String!
}


type Mutation {
  createPersonInMongo(person: PersonInput!): String
}


input PersonInput {
  name: String!
  dateOfBirth: String!
  address: String!
  email: String!
}


